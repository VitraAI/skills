# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Run your localization work from chat. Ask what's due, spin up a project for a
  new market, move tasks along, and hand them to the right people, without
  opening the board. Everything is named the way your team names it: projects,
  statuses, priorities and people.
when-to-use: >-
  Reach for it for the daily stand-up ("what's due today?"), when a new request
  comes in and needs a project, or when work changes hands.
features:
  - title: What's due, at a glance
    description: Your open tasks, approvals and checklist items across projects, or a project's overdue and upcoming tasks.
  - title: How it's going
    description: A project's progress, on-time rate, bottlenecks and forecast, and who has room for more.
  - title: Projects in one line
    description: Type, languages, dates, status and priority, set by name.
  - title: Your board, your words
    description: Uses each project's own statuses and priorities; no ids anywhere.
  - title: People by name
    description: Project leads and members, task assignees and watchers, by name or email.
  - title: Safe changes
    description: Deletes always ask first; ambiguous names come back as a question.
  - title: Job assignments
    description: Put people on each language of a dub, document or image job.
  - title: Run a folder
    description: Preview, then run the project's workflow on every file in one of its folders.
use-cases:
  - title: Daily stand-up
    description: What's due, what's overdue, who's on it.
  - title: New market launch
    description: A project per market with its languages and deadline.
  - title: Hand-offs
    description: Move a task to review and assign the reviewer in one step.
