# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Adapt one image to every size you need. This is not a crop or a stretch: the
  model re-composes the artwork for each aspect ratio, so the subject, text and
  margins still work at that shape. Give it an image and one or more sizes, and
  it returns a rendered image per size.
when-to-use: >-
  Reach for it when one creative has to ship in several formats — Instagram
  Story, LinkedIn, a 1080x1920 ad. Each size is generated by a model, so it
  costs credits per size and takes a little time. To create a new image or
  translate the text in one, use Image Creator or Image Translation instead.
features:
  - title: Re-composed, not cropped
    description: Each aspect ratio is re-laid out so the subject, text and margins still fit.
  - title: Many sizes in one run
    description: Pass several WIDTHxHEIGHT targets and get one variant per size.
  - title: Local or Drive image
    description: Works from a local image file or one already in your Drive.
  - title: Keeps partial results
    description: If some sizes fail, the ones that rendered are still returned.
  - title: Approve, check and fix
    description: Approve PRO plans, run a quality check, fix the issues it finds, or redo a size with a note.
  - title: Save and export
    description: Save any size to the Drive or download them all, and find past resizes again.
use-cases:
  - title: Multi-channel ads
    description: Turn one approved creative into every placement size a campaign needs.
  - title: Social formats
    description: Adapt a landscape banner into Story, square and portrait posts.
  - title: Localized campaigns
    description: Resize an image after translating it, reusing the same artwork.
mcp-toolset: image
mcp-tools:
  - name: find_assets
    title: Find files in the Drive
  - name: adapt_image_sizes
    title: Adapt an image to other sizes
  - name: get_adapted_sizes
    title: Check adapted sizes
  - name: manage_adapted_size
    title: Approve, redo, check, fix or save a resized size
  - name: download_adapted_sizes
    title: Download links for every size of a resize
  - name: list_adapted_images
    title: List past resizes
  - name: update_adapted_image
    title: Rename or file a resize
  - name: delete_adapted_image
    title: Delete a resize
  - name: list_languages
    title: List languages
  - name: quote_cost
    title: Price work in credits
related-skills:
  - name: image-translation
    why: Translate the image's text first; it can also reshape a translated image by aspect ratio.
  - name: image-creator
    why: Generate a new image to resize.
