# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  The shared parts of your Vitra organization from any agent: find, upload and
  organize files in the Drive, keep work folders, check credits and price work
  before it starts, search the organization's saved knowledge, and follow
  translations sent from the Figma, Canva, Adobe and Word plugins.
when-to-use: >-
  Reach for it for files, folders, credits and saved knowledge, or anything
  Vitra does that no other Vitra skill covers. The product skills handle images,
  documents, video, voice, memory, quality, campaigns, workflows and projects.
features:
  - title: Drive
    description: Find, upload, download, move, rename and trash files and folders.
  - title: Work folders
    description: Group jobs for one engagement and see what is filed in each.
  - title: Credits and quotes
    description: The balance, and the exact price of work before it starts.
  - title: Organization knowledge
    description: Search, save and version the facts and guidelines your team keeps.
  - title: Design-tool jobs
    description: Review, correct and score translations from Figma, Canva, Adobe and Word.
use-cases:
  - title: Find earlier work
    description: "\"Last week's banner\" instead of uploading it again."
  - title: Budget check
    description: See what a batch of jobs will cost before starting any of them.
  - title: Brief with context
    description: Pull the organization's notes on an audience into a task.
mcp-toolset: core
