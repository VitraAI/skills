  - name: update_glossary
    title: Rename or re-describe a glossary
  - name: delete_glossary
    title: Delete a glossary
  - name: add_glossary_entry
    title: Add a glossary entry
  - name: update_glossary_entry
    title: Edit a glossary entry
  - name: delete_glossary_entries
    title: Delete glossary entries
  - name: get_term_base
    title: Read a term base
  - name: create_term_base
    title: Create a term base
  - name: update_term_base
    title: Rename or re-describe a term base
  - name: delete_term_base
    title: Delete a term base
  - name: add_term_base_concept
    title: Add a concept to a term base
  - name: add_term_base_term
    title: Add a term to a concept
  - name: update_term_base_concept
    title: Edit a concept's details
  - name: update_term_base_term
    title: Edit a term
  - name: delete_term_base_entry
