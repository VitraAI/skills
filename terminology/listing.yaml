# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Tell every translation how to word things: glossaries for fixed and
  do-not-translate terms, term bases for preferred and forbidden terminology,
  and style guides for tone and writing rules — typed in or extracted from
  your existing guide.
when-to-use: >-
  Reach for it when a wording decision should hold everywhere — a brand name,
  a product term, formal or informal address — rather than being fixed job by
  job.
features:
  - title: Glossaries
    description: Fixed wordings and do-not-translate terms.
  - title: Term bases
    description: Concepts with preferred and forbidden terms per language.
  - title: Style guides
    description: Ordered writing rules, bulk-edited or copied between languages.
  - title: Extract rules
    description: Turn an existing style guide's files into rules.
use-cases:
  - title: Brand protection
    description: Keep product names untranslated in every language.
  - title: Tone of voice
    description: Formal address in German, informal in Spanish.
mcp-toolset: memory
mcp-tools:
