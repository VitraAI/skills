# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Translate the text baked into an image — signage, packaging, ad creatives,
  screenshots, menus — and get back a new image with the translated text set
  into the original layout. Not a transcript: the output is the image itself,
  ready to use. Reuse your organization's Translation Memory to keep approved
  terminology, and re-render the result at other aspect ratios without
  translating again.
when-to-use: >-
  Reach for it when an image's text needs to read in another language and the
  design has to stay intact. To create a new image, resize one, or translate a
  document or subtitle file, use Image Creator, Adaptive Resize or the document
  skills instead.
features:
  - title: Layout preserved
    description: Translated text is re-rendered into the original design, not overlaid.
  - title: One call, end to end
    description: Upload, text detection, translation and rendering run as a single job.
  - title: Translation Memory
    description: Lists your org's memories for the language pair and reuses approved wording.
  - title: Resize after translating
    description: Re-render a translated image at another aspect ratio with no re-translation.
  - title: More languages, one analysis
    description: Add languages to an image already translated; only the new translations are paid for.
  - title: Fix any line
    description: See the image's text line by line, correct or keep lines, and re-render.
  - title: Save and find again
    description: Save to the Drive, file into folders, list past images, retry failures.
use-cases:
  - title: Localized ad creatives
    description: Ship one campaign visual in every market's language.
  - title: Packaging and signage
    description: Produce translated versions of product shots and in-store signs.
  - title: App screenshots
    description: Localize store screenshots while keeping the UI layout intact.
  - title: Menus and flyers
    description: Translate printed material and keep its design.
