# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra MCP tools
# that do the same jobs (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Make subtitles from a video without opening the editor, optionally following
  a script you already have. Review and correct lines by number, add more
  languages to the same job, then download SRT, VTT or other formats — or
  render the video with the subtitles burned in. Progress shows in the same
  steps as the Vitra webapp, and anything that costs credits is confirmed
  first.
when-to-use: >-
  Reach for it for captions on a video — "subtitle this video", "add Hindi
  captions", "burn the subtitles in". Input is a video, local or a public URL.
  To translate a subtitle file you already have, use Subtitle Translation; for
  a voice-over, Video Dubbing.
features:
  - title: From any video
    description: Transcribes the speech into timed subtitles in the language spoken.
  - title: Script-guided
    description: Follows a script you already have, keeping a timed script's cues as they are.
  - title: Line-by-line review
    description: Correct text and timing, split, merge or delete lines by number.
  - title: More languages
    description: Adds translated subtitle languages to the same job, from the reviewed source.
  - title: Any format, or burned in
    description: SRT, VTT, DFXP, STL, TXT and more, or the video with subtitles rendered in.
use-cases:
  - title: Accessible video
    description: Caption product and training videos in their own language.
  - title: Multilingual captions
    description: Caption a video once, review it, then add every market's language.
  - title: Social clips
    description: Burn subtitles into short videos for sound-off viewing.
mcp-toolset: subtitles
mcp-tools:
  - name: start_subtitles
    title: Make or translate subtitles
  - name: get_subtitles
    title: Check or read subtitles
  - name: edit_subtitle_lines
    title: Edit subtitle lines
  - name: add_subtitle_language
    title: Add subtitle languages
  - name: download_subtitles
    title: Get subtitles as a file
  - name: burn_subtitles
    title: Render video with subtitles
related-skills:
  - name: video-dubbing
    why: A voice-over in other languages; it can burn these subtitles into the dubbed video.
