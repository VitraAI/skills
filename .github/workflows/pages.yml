name: Publish catalog

# Publishes dist/ to GitHub Pages: catalog.json and skills/<name>.json for the
# Skill Library, downloads/<name>.zip, and the Agent Skills discovery index at
# /.well-known/agent-skills/. Runs when main changes, or by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # dist/.well-known/agent-skills (the discovery index behind
          # `npx skills add https://<pages host>`) and .nojekyll are dotfiles,
          # which v4+ leaves out unless told otherwise.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
