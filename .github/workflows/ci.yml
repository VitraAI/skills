name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # SKILL.md spec, listings, references, secrets, manifest versions,
      # and the vendored _lib helpers in every skill.
      - run: npm run validate

      # Every skill's scripts against a local fake Vitra API (no network).
      - run: npm test

      # The catalog and archives Pages would publish.
      - run: npm run build
