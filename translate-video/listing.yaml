# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Dub a video into other languages, make subtitles from a video, or translate
  SRT and VTT files — then review every line, fix issues and export. Library
  voices by default; a speaker's own cloned voice or lip-sync only with their
  consent.
when-to-use: >-
  Reach for it whenever a video has to speak or read in another language, or a
  subtitle file has to be translated. For narration from a script, use Text to
  Speech.
features:
  - title: Dubbing with a voice decision
    description: Pauses so each speaker gets a library voice or, with consent, their own.
  - title: Line-by-line review
    description: Edit, split, merge, re-voice lines; set emotions and pronunciations.
  - title: Subtitles two ways
    description: From a video, or by translating an SRT, VTT, ASS or SSA file, timing kept.
  - title: Issues fixed before export
    description: Lists what blocks export and fixes rate and timing problems.
  - title: Export and deliver
    description: Dubbed video per language, subtitles burned in, or subtitle files in many formats.
use-cases:
  - title: Marketing videos
    description: Turn one product video into several market-ready language versions.
  - title: E-learning
    description: Caption and dub course content, reviewed line by line.
  - title: Subtitle files
    description: One caption file, every language your viewers speak.
mcp-toolset: dub
