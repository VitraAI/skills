# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Keep every translation on-brand: ask how a phrase is translated, fix it once
  for everyone, translate app strings and product copy memory-first, and manage
  the glossaries, term bases and style guides your translations follow.
when-to-use: >-
  Reach for it whenever terminology or consistency matters — before a launch,
  after a review, when onboarding a client's existing translations, or to
  translate short strings exactly the way you always have.
features:
  - title: Look up approved wording
    description: See how a phrase was translated before, and whether it's verified or approved.
  - title: Fix it once
    description: Correct an entry and every future translation uses it.
  - title: Memory-first translation
    description: Short texts reuse exact and close matches; only the rest is machine-translated.
  - title: Share across organizations
    description: Share a memory with child organizations, or stop sharing it.
  - title: Glossaries, term bases, style guides
    description: Create and edit entries, terms and writing rules, and link them to a memory.
use-cases:
  - title: App localization
    description: Translate UI strings consistently across releases.
  - title: Client onboarding
    description: Set up a client's memory, glossary and style guide before the first project.
  - title: Review follow-up
    description: Turn a reviewer's corrections into approved wording for everyone.
mcp-toolset: memory
