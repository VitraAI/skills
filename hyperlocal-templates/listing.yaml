# The skill's page in the Skill Library (catalog.json / skills/<name>.json).
# Not part of the skill: no agent reads it, and scripts/build.mjs leaves it
# out of every archive. `mcp-toolset` + `mcp-tools`: the Vitra server tools
# the skill uses (checked against scripts/mcp-tools.json).
# `related-skills`: skills people move on to from this one, and why.
about: >-
  Build the creative your Hyperlocal campaigns send: templates tied to your
  products, localized per language with translated images and per-contact
  overlays, plus the WhatsApp and Facebook message templates that carry them.
when-to-use: >-
  Reach for it when preparing a campaign's creative — a new offer, a new
  language, a new product — before a broadcast is sent.
features:
  - title: Creative templates
    description: Product images or videos with per-contact overlays.
  - title: Every language
    description: Localized templates with the image text translated.
  - title: Overlays
    description: Edit, copy and preview the fields each contact sees.
  - title: Message templates
    description: WhatsApp templates through Meta approval, and Facebook posts.
  - title: Product catalog
    description: Products and models the templates belong to.
use-cases:
  - title: Regional offers
    description: One offer template in Hindi, Tamil and Marathi.
  - title: New product line
    description: Add the models and a launch template before the broadcast.
